name: Diagnose AI recommendation review database
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-practice-reviews.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Connect and check migration state without modifying data
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.101.255.243 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes root@46.101.255.243 'bash -s' <<'REMOTE'
          set -u
          cd /var/www/codeclinic || exit 1
          output=$(packages/database/node_modules/.bin/prisma migrate status --schema=packages/database/prisma/schema.prisma 2>&1)
          result=$?
          echo "PRISMA_EXIT_CODE=$result"
          # Prisma prints the heading and pending migration names on separate lines.
          # Match complete output, not a single-line 'following migration.*not yet' regex.
          if [ "$result" -eq 0 ]; then
            echo 'MIGRATION_STATUS=UP_TO_DATE'
          elif printf '%s' "$output" | grep -Eqi 'not yet been applied|pending migrations|have not been applied'; then
            echo 'MIGRATION_STATUS=PENDING'
          elif printf '%s' "$output" | grep -Eqi 'diverged|failed migration|migration history'; then
            echo 'MIGRATION_STATUS=DIVERGED_OR_FAILED'
          elif printf '%s' "$output" | grep -Eqi 'P1001|P1002|P1017|can.t reach database|connection refused|connection timed out'; then
            echo 'MIGRATION_STATUS=CONNECTION_ERROR'
          elif printf '%s' "$output" | grep -Eqi 'P1010|P1000|authentication failed|access denied'; then
            echo 'MIGRATION_STATUS=AUTH_ERROR'
          else
            echo 'MIGRATION_STATUS=UNKNOWN'
          fi
          if printf '%s' "$output" | grep -q '20261022130000_task_approval_metadata'; then
            echo 'APPROVAL_METADATA_MIGRATION_MENTIONED=YES'
          else
            echo 'APPROVAL_METADATA_MIGRATION_MENTIONED=NO'
          fi
          if printf '%s' "$output" | grep -q '20261022160000_practice_intelligence_pending_dedupe'; then
            echo 'DEDUPE_MIGRATION_MENTIONED=YES'
          else
            echo 'DEDUPE_MIGRATION_MENTIONED=NO'
          fi
          # Report only migration names; no raw output or database credentials.
          printf '%s\\n' "$output" | grep -E '^[[:space:]]*20[0-9]{12}_[a-zA-Z0-9_]+[[:space:]]*$' | sed -E 's/^[[:space:]]*/PENDING_MIGRATION=/' || true
          count=$(printf '%s\\n' "$output" | grep -Ec '^[[:space:]]*20[0-9]{12}_[a-zA-Z0-9_]+[[:space:]]*$' || true)
          echo "PENDING_MIGRATION_COUNT=$count"
          # Read-only schema and migration preflight using Prisma's existing DB URL.
          # Never print connection strings or patient/task rows.
          cd packages/database
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          (async () => {
            const db = new PrismaClient();
            try {
              const cols = await db.$queryRawUnsafe("SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'tasks' AND column_name IN ('approvalStatus','proposedAction','reviewedById','reviewedAt','reviewNotes')");
              const names = new Set(cols.map(x => x.column_name));
              console.log('APPROVAL_COLUMNS_PRESENT=' + ['approvalStatus','proposedAction','reviewedById','reviewedAt','reviewNotes'].filter(x => names.has(x)).join(','));
              const migration = await db.$queryRawUnsafe("SELECT migration_name, finished_at IS NOT NULL AS applied, rolled_back_at IS NOT NULL AS rolled_back FROM \"_prisma_migrations\" WHERE migration_name IN ('20261022130000_task_approval_metadata','20261022160000_practice_intelligence_pending_dedupe') ORDER BY migration_name");
              for (const m of migration) console.log('MIGRATION_RECORD=' + m.migration_name + ':applied=' + m.applied + ':rolled_back=' + m.rolled_back);
              if (names.has('approvalStatus')) {
                const duplicate = await db.$queryRawUnsafe("SELECT count(*)::int AS groups FROM (SELECT \"entityId\" FROM tasks WHERE \"entityType\" = 'PRACTICE_INTELLIGENCE' AND \"approvalStatus\" = 'PENDING_REVIEW' GROUP BY \"entityId\" HAVING count(*) > 1) d");
                console.log('PENDING_DUPLICATE_GROUPS=' + duplicate[0].groups);
              } else {
                console.log('PENDING_DUPLICATE_GROUPS=NOT_APPLICABLE_COLUMN_MISSING');
              }
            } catch (e) {
              console.log('PREFLIGHT_ERROR_CODE=' + (typeof e.code === 'string' && /^P[0-9]{4}$/.test(e.code) ? e.code : 'OTHER'));
              process.exitCode = 1;
            } finally { await db.$disconnect(); }
          })();
          NODE
          cd ../..
          # Backup prerequisites only. Do not print DATABASE_URL or backup contents.
          if command -v pg_dump >/dev/null 2>&1; then
            echo "PG_DUMP_AVAILABLE=YES"
            pg_dump --version | sed -E 's/.* ([0-9]+)(\\.[0-9]+)?.*/PG_DUMP_MAJOR=\\1/'
          else
            echo "PG_DUMP_AVAILABLE=NO"
          fi
          if command -v pg_restore >/dev/null 2>&1; then
            echo "PG_RESTORE_AVAILABLE=YES"
          else
            echo "PG_RESTORE_AVAILABLE=NO"
          fi
          if [ -d /var/backups ] && [ -w /var/backups ]; then
            echo "BACKUP_DIRECTORY_WRITABLE=YES"
          else
            echo "BACKUP_DIRECTORY_WRITABLE=NO"
          fi
          # Does not establish an off-server or restorable database backup.
          # Do not print raw migration output: it may contain sensitive connection details.
          REMOTE
