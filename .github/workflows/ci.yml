name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Type checking ────────────────────��────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter database exec prisma generate

      - name: Type check API
        run: pnpm --filter api exec tsc --noEmit

  # ── Unit tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:       postgresql://postgres:testpass@localhost:5432/codeclinic_test
      JWT_SECRET:         test-jwt-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-characters
      JWT_EXPIRES_IN:     12h
      NODE_ENV:           test
      APP_URL:            http://localhost:3000

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB:       codeclinic_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter database exec prisma generate

      - name: Enable pgvector extension
        run: psql postgresql://postgres:testpass@localhost:5432/codeclinic_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Push schema to test DB
        run: pnpm --filter database exec prisma db push --skip-generate

      # A second, disposable database exists only inside this CI job's
      # PostgreSQL service. Never point this at the production DATABASE_URL.
      - name: Create isolated CRM integration database
        run: psql postgresql://postgres:testpass@localhost:5432/codeclinic_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE codeclinic_ci_integration;"

      - name: Enable pgvector in isolated CRM integration database
        run: psql "${DATABASE_URL%/*}/codeclinic_ci_integration" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply schema to isolated CRM integration database
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/codeclinic_ci_integration
        run: pnpm --filter database exec prisma db push --skip-generate

      - name: Run unit tests
        env:
          CRM_INTEGRATION_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/codeclinic_ci_integration
        run: pnpm --filter api exec vitest run --reporter=verbose

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Replay checked-in SQL migrations on a disposable PostgreSQL instance.
  # This is separate from the db-push unit-test setup and never uses live credentials.
  migration-replay:
    name: SQL Migration Replay
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/codeclinic_migration_ci
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codeclinic_migration_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Enable pgvector extension
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Replay committed Prisma SQL migrations
        run: pnpm --filter database exec prisma migrate deploy
      - name: Verify migration status
        run: pnpm --filter database exec prisma migrate status

  # Stage 1 SQL smoke test independent of the incomplete legacy migration chain.
  # Build the current schema in a disposable DB, remove ONLY Stage 1 additions,
  # then apply the actual checked-in Stage 1 SQL and check its resulting objects.
  stage1-sql-smoke:
    name: Stage 1 SQL Smoke Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/codeclinic_stage1_ci
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codeclinic_stage1_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Enable pgvector
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Create disposable schema
        run: pnpm --filter database exec prisma db push --skip-generate
      - name: Simulate schema before Stage 1
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE "treatment_follow_up_events";
          ALTER TABLE "treatment_plans"
            DROP COLUMN "patientDecision",
            DROP COLUMN "decisionReason",
            DROP COLUMN "coordinatorId",
            DROP COLUMN "nextAction",
            DROP COLUMN "clinicalReviewRequired";
          SQL
      - name: Apply actual Stage 1 migration SQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f packages/database/prisma/migrations/20261026102000_treatment_stage1_coordination/migration.sql
      - name: Verify Stage 1 objects and default
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF to_regclass('public.treatment_follow_up_events') IS NULL THEN
              RAISE EXCEPTION 'Stage 1 event table missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'treatment_plans'
                AND column_name = 'clinicalReviewRequired'
                AND column_default LIKE '%false%'
            ) THEN
              RAISE EXCEPTION 'Stage 1 clinical review default missing';
            END IF;
          END $$;
          SQL

  # ── Build ─────────────────────────────��───────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter database exec prisma generate

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: https://api-production-4c43.up.railway.app
